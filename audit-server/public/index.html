<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Auditor Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍪 Cookie Auditor Dashboard</h1>
      <div class="header-actions">
        <button id="refresh-btn" class="btn btn-primary">🔄 Refresh</button>
        <button id="clear-btn" class="btn btn-danger">🗑️ Clear All</button>
        <div class="auto-refresh">
          <label>
            <input type="checkbox" id="auto-refresh" checked>
            Auto-refresh (5s)
          </label>
        </div>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Reports</div>
        <div class="stat-value" id="total-reports">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Devices</div>
        <div class="stat-value" id="total-devices">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Cookies</div>
        <div class="stat-value" id="total-cookies">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unique Domains</div>
        <div class="stat-value" id="unique-domains">0</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="search" placeholder="🔍 Search device, domain, cookie..." class="search-input">
      <select id="device-filter" class="filter-select">
        <option value="">All Devices</option>
      </select>
      <button id="export-btn" class="btn btn-secondary">📥 Export JSON</button>
    </div>

    <div id="reports-container" class="reports-container">
      <div class="loading">Loading reports...</div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
